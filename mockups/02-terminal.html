<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Engineer's terminal. Monospace everything, typed intro, scanlines. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0d0c;
      --fg: #d7e3dc;
      --dim: #5d6b63;
      --hi: #b6ff5c;
      --rule: #1d2420;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      font-size: 14px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    }

    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--hi); color: var(--bg); }

    .bar {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      color: var(--dim);
      font-size: 12px;
    }
    .bar .dots { display: flex; gap: 6px; align-items: center; }
    .bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); }
    .bar b { color: var(--fg); font-weight: 400; }

    main {
      flex: 1;
      padding: 3rem 1.25rem;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2rem;
    }

    .line { color: var(--dim); white-space: pre-wrap; }
    .line .p { color: var(--hi); }
    .line .c { color: var(--fg); }

    h1 {
      font-size: clamp(2.4rem, 8vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      min-height: 2em;
    }
    h1 .dim { color: var(--dim); font-weight: 300; }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 0.9em;
      background: var(--hi);
      vertical-align: -0.08em;
      margin-left: 0.05em;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .menu {
      display: grid;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .menu.on { opacity: 1; }
    .menu a {
      display: inline-flex;
      gap: 1rem;
      width: fit-content;
      padding: 0.35rem 0.6rem;
      margin-left: -0.6rem;
    }
    .menu a .k { color: var(--dim); }
    .menu a:hover { background: var(--hi); color: var(--bg); }
    .menu a:hover .k { color: var(--bg); }

    .status {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--dim);
    }
    .status .mode { background: var(--hi); color: var(--bg); padding: 0 0.5rem; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span><b>the-larex</b> — zsh — 80×24</span>
    <a href="mailto:hello@thelarex.com">contact</a>
  </div>

  <main>
    <div class="line"><span class="p">~/the-larex ❯</span> <span class="c">cat studio.txt</span></div>
    <h1 id="type" aria-label="Product Design and Development"></h1>
    <div class="menu" id="menu">
      <a href="mailto:hello@thelarex.com"><span class="k">[1]</span> get in touch</a>
      <a href="mailto:hello@thelarex.com"><span class="k">[2]</span> hello@thelarex.com</a>
    </div>
  </main>

  <div class="status">
    <span><span class="mode">NORMAL</span>&nbsp; product-studio</span>
    <span>&copy; 2026 The Larex</span>
  </div>

  <script>
    // Type the headline character by character, then reveal the menu
    const el = document.getElementById("type");
    const parts = [["Product Design", ""], [" and ", "dim"], ["Development", ""]];
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    el.appendChild(cursor);

    let pi = 0, ci = 0, node = null;
    function step() {
      if (pi >= parts.length) {
        document.getElementById("menu").classList.add("on");
        return;
      }
      const [text, cls] = parts[pi];
      if (ci === 0) {
        node = document.createElement("span");
        if (cls) node.className = cls;
        el.insertBefore(node, cursor);
      }
      node.textContent += text[ci++];
      if (ci >= text.length) { pi++; ci = 0; }
      setTimeout(step, 40 + Math.random() * 60);
    }
    setTimeout(step, 500);

    document.addEventListener("keydown", (e) => {
      if (e.key === "1" || e.key === "2") location.href = "mailto:hello@thelarex.com";
    });
  </script>
</body>
</html>
