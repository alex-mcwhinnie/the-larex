<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Markup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400&family=Caveat:wght@700&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Design-tool canvas (08) marked up in red pencil (05). Visitors can draw too. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f2ef;
      --dot: rgba(0, 0, 0, 0.14);
      --ink: #151515;
      --muted: #8a8780;
      --sel: #2f6bff;
      --pencil: #e2412a;
      --panel: #ffffff;
      --rule: rgba(0, 0, 0, 0.08);
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: "Inter Tight", Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .mono { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.02em; }

    .hand {
      font-family: "Caveat", cursive;
      font-weight: 700;
      color: var(--pencil);
      line-height: 1;
      letter-spacing: 0;
    }

    header {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem;
      padding: 0.6rem 0.75rem 0.6rem 1rem;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .logo { font-weight: 700; display: flex; align-items: center; gap: 0.6rem; }
    .logo i { width: 14px; height: 14px; border-radius: 4px; background: var(--ink); }
    .crumbs { color: var(--muted); }
    .crumbs b { color: var(--ink); font-weight: 400; }
    .share {
      background: var(--sel);
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .share:hover { filter: brightness(1.1); }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem 8rem;
    }

    /* ── Selected frame ───────────────────────────────── */

    .frame { position: relative; padding: 1.5rem 2rem; }

    .frame-label {
      position: absolute;
      left: 0;
      top: -1.6rem;
      color: var(--sel);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .sel {
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--sel);
      pointer-events: none;
      animation: fade-in 0.4s ease 0.3s both;
    }
    .sel i {
      position: absolute;
      width: 9px; height: 9px;
      background: #fff;
      border: 1.5px solid var(--sel);
    }
    .sel i:nth-child(1) { left: -5px; top: -5px; }
    .sel i:nth-child(2) { right: -5px; top: -5px; }
    .sel i:nth-child(3) { left: -5px; bottom: -5px; }
    .sel i:nth-child(4) { right: -5px; bottom: -5px; }
    .sel i:nth-child(5) { left: calc(50% - 4.5px); top: -5px; }
    .sel i:nth-child(6) { left: calc(50% - 4.5px); bottom: -5px; }

    .size {
      position: absolute;
      left: 50%;
      bottom: -2rem;
      transform: translateX(-50%);
      background: var(--sel);
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      animation: fade-in 0.4s ease 0.5s both;
    }

    @keyframes fade-in { from { opacity: 0; } }

    .eyebrow { color: var(--muted); margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.1em; }

    h1 {
      font-size: clamp(2.8rem, 9vw, 8.5rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.06em;
    }
    h1 .soft { color: var(--muted); font-weight: 400; }

    /* ── Pencil markup ────────────────────────────────── */

    .note { position: relative; display: inline-block; white-space: nowrap; }
    .note svg { position: absolute; pointer-events: none; overflow: visible; }
    .note path, .scribble path {
      fill: none;
      stroke: var(--pencil);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4000;
      stroke-dashoffset: 4000;
      animation: draw 1.1s cubic-bezier(0.6, 0, 0.3, 1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .circle svg { inset: -14% -6% -10% -6%; width: 112%; height: 124%; }
    .circle path { animation-delay: 0.9s; }

    .underline svg { left: 0; right: 0; bottom: -0.1em; width: 100%; height: 0.2em; }
    .underline path { animation-delay: 1.5s; }

    .margin {
      position: absolute;
      font-size: clamp(1.3rem, 2.1vw, 1.9rem);
      white-space: nowrap;
      opacity: 0;
      animation: pop 0.5s ease forwards;
    }
    .circle .margin { left: 100%; top: -0.9em; transform: rotate(-6deg); animation-delay: 1.7s; }
    @keyframes pop { to { opacity: 1; } }

    /* "say hi" pointing at the toolbar CTA */
    .scribble {
      position: fixed;
      left: 50%;
      bottom: 4.6rem;
      transform: translateX(3.5rem);
      display: flex;
      align-items: flex-end;
      gap: 0.25rem;
      z-index: 2;
      pointer-events: none;
    }
    .scribble { transition: opacity 0.2s; }
    body.drawing .scribble { opacity: 0; }
    .scribble span { font-size: 1.7rem; transform: rotate(-5deg); opacity: 0; animation: pop 0.5s ease 2.4s forwards; }
    .scribble path { animation-delay: 2.1s; animation-duration: 0.6s; }

    /* ── Toolbar ──────────────────────────────────────── */

    .toolbar {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem;
      background: var(--ink);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      z-index: 4;
    }
    .tool {
      display: grid;
      place-items: center;
      width: 2.4rem; height: 2.4rem;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tool:hover { color: #fff; }
    .tool.on { background: var(--sel); color: #fff; }
    .tool.pen.on { background: var(--pencil); }
    .tool svg { width: 18px; height: 18px; }
    .sep { width: 1px; height: 1.5rem; background: rgba(255,255,255,0.15); margin: 0 0.35rem; }
    .toolbar .cta {
      padding: 0 1rem;
      height: 2.4rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      color: var(--ink);
      border-radius: 9px;
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .toolbar .cta:hover { background: #e9e9e9; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 5rem;
      transform: translate(-50%, 6px);
      background: var(--ink);
      color: #fff;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 4;
      white-space: nowrap;
    }
    .hint.show { opacity: 1; transform: translate(-50%, 0); }

    /* Visitor doodle layer */
    #doodle {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      touch-action: none;
    }
    body.drawing #doodle { pointer-events: auto; cursor: crosshair; }

    footer { position: fixed; left: 1.25rem; bottom: 1.6rem; color: var(--muted); }
    .zoom { position: fixed; right: 1.25rem; bottom: 1.6rem; color: var(--muted); }

    @media (max-width: 760px) {
      .crumbs, footer, .zoom, .tool.extra, .scribble, .margin { display: none; }
      .frame { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo"><i></i>The Larex</span>
    <span class="crumbs mono">Studio / <b>Home</b></span>
    <a class="share" href="mailto:hello@thelarex.com">Contact</a>
  </header>

  <main>
    <div class="frame" id="frame">
      <span class="frame-label mono">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 0v10M7 0v10M0 3h10M0 7h10" stroke="currentColor"/></svg>
        Hero
      </span>
      <p class="eyebrow mono">Product Studio</p>
      <h1>
        Product
        <span class="note circle">Design
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path vector-effect="non-scaling-stroke" d="M8 30 C 20 4, 80 2, 95 28 C 104 50, 92 88, 50 94 C 12 98, -2 70, 4 46 C 8 30, 22 14, 40 10" />
          </svg>
          <span class="margin hand" aria-hidden="true">← the fun part</span>
        </span><br />
        <span class="soft">and</span>
        <span class="note underline">Development
          <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
            <path vector-effect="non-scaling-stroke" d="M1 6 C 20 3, 45 8, 70 4 S 95 5, 99 3" />
          </svg>
        </span>
      </h1>
      <div class="sel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="size mono" id="size" aria-hidden="true"></span>
    </div>
  </main>

  <div class="scribble" aria-hidden="true">
    <svg width="46" height="40" viewBox="0 0 46 40" fill="none">
      <path d="M44 6 C 30 4, 14 12, 8 34 M8 34 L 3 24 M8 34 L 16 28" />
    </svg>
    <span class="hand">say hi!</span>
  </div>

  <canvas id="doodle" aria-hidden="true"></canvas>

  <span class="hint mono" id="hint">Draw anywhere · double-click to clear</span>

  <nav class="toolbar" aria-label="Tools and contact">
    <button type="button" class="tool on" id="t-move" aria-label="Move tool">
      <svg viewBox="0 0 18 18" fill="currentColor"><path d="M4 2l10 6-4.5 1.2L7.5 14z"/></svg>
    </button>
    <button type="button" class="tool pen" id="t-pen" aria-label="Pencil tool: draw on the page">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12.5 2.5l3 3L6 15l-3.8.8L3 12z"/></svg>
    </button>
    <span class="tool extra" aria-hidden="true">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2v14M13 2v14M2 5h14M2 13h14"/></svg>
    </span>
    <span class="tool extra" aria-hidden="true">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h10M9 4v11"/></svg>
    </span>
    <span class="sep" aria-hidden="true"></span>
    <a class="cta" href="mailto:hello@thelarex.com">Get in touch ↗</a>
  </nav>

  <footer class="mono">&copy; 2026 The Larex</footer>
  <span class="zoom mono" aria-hidden="true">100%</span>

  <script>
    // Live W × H readout for the selected frame
    const frame = document.getElementById("frame");
    const size = document.getElementById("size");
    new ResizeObserver(() => {
      const r = frame.getBoundingClientRect();
      size.textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`;
    }).observe(frame);

    // Pencil tool: visitors can doodle over the page
    const canvas = document.getElementById("doodle");
    const ctx = canvas.getContext("2d");
    const move = document.getElementById("t-move");
    const pen = document.getElementById("t-pen");
    const hint = document.getElementById("hint");
    let strokes = [];
    let current = null;
    let hintTimer;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--pencil");
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const s of strokes) {
        ctx.beginPath();
        s.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
      }
    }

    function setTool(drawing) {
      document.body.classList.toggle("drawing", drawing);
      pen.classList.toggle("on", drawing);
      move.classList.toggle("on", !drawing);
      clearTimeout(hintTimer);
      hint.classList.toggle("show", drawing);
      if (drawing) hintTimer = setTimeout(() => hint.classList.remove("show"), 2500);
    }

    move.addEventListener("click", () => setTool(false));
    pen.addEventListener("click", () => setTool(!document.body.classList.contains("drawing")));
    addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "b") setTool(true);
      if (e.key === "v" || e.key === "Escape") setTool(false);
    });

    canvas.addEventListener("pointerdown", (e) => {
      current = [[e.clientX, e.clientY]];
      strokes.push(current);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!current) return;
      current.push([e.clientX, e.clientY]);
      redraw();
    });
    canvas.addEventListener("pointerup", () => { current = null; });
    canvas.addEventListener("dblclick", () => { strokes = []; redraw(); });

    addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
