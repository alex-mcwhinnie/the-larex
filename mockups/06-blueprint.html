<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Blueprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Technical drawing. Blueprint blue, dimension lines, title block. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #12366b;
      --line: rgba(220, 235, 255, 0.85);
      --faint: rgba(220, 235, 255, 0.10);
      --faint2: rgba(220, 235, 255, 0.05);
      --fg: #eef4ff;
      --muted: rgba(220, 235, 255, 0.55);
      --gutter: 2.5rem;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--faint) 1px, transparent 1px),
        linear-gradient(var(--faint2) 1px, transparent 1px),
        linear-gradient(90deg, var(--faint2) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
      color: var(--fg);
      font-family: "Inter Tight", Helvetica, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* Drawing border */
    .sheet {
      position: fixed;
      inset: 1rem;
      border: 1px solid var(--line);
      pointer-events: none;
    }
    .sheet::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid var(--faint);
    }

    .mono {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 2.25rem var(--gutter) 0;
    }
    header .logo { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.85rem; }
    header a:hover { color: var(--fg); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem var(--gutter) 3rem;
    }

    .figure {
      position: relative;
      width: fit-content;
      max-width: 100%;
      padding: 0 0 0 2.5rem;
    }

    h1 {
      font-size: clamp(3rem, 9.5vw, 9rem);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }
    h1 b { font-weight: 700; }

    /* Horizontal dimension above the heading */
    .dim-x {
      position: absolute;
      left: 2.5rem;
      right: 0;
      top: -2.25rem;
      height: 1px;
      background: var(--line);
      transform-origin: left;
      animation: grow-x 1.2s cubic-bezier(0.6, 0, 0.2, 1) forwards;
      transform: scaleX(0);
    }
    .dim-x::before, .dim-x::after {
      content: "";
      position: absolute;
      top: -6px;
      width: 1px;
      height: 13px;
      background: var(--line);
    }
    .dim-x::before { left: 0; }
    .dim-x::after { right: 0; }
    .dim-x span {
      position: absolute;
      left: 50%;
      top: -0.75rem;
      transform: translate(-50%, -50%);
      background: var(--bg);
      padding: 0 0.5rem;
      white-space: nowrap;
    }

    /* Vertical dimension left of the heading */
    .dim-y {
      position: absolute;
      left: 0.75rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line);
      transform-origin: top;
      transform: scaleY(0);
      animation: grow-y 1.2s cubic-bezier(0.6, 0, 0.2, 1) 0.3s forwards;
    }
    .dim-y::before, .dim-y::after {
      content: "";
      position: absolute;
      left: -6px;
      width: 13px;
      height: 1px;
      background: var(--line);
    }
    .dim-y::before { top: 0; }
    .dim-y::after { bottom: 0; }

    @keyframes grow-x { to { transform: scaleX(1); } }
    @keyframes grow-y { to { transform: scaleY(1); } }

    .callout {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 3rem 0 0 2.5rem;
    }
    .callout .bubble {
      display: grid;
      place-items: center;
      width: 1.6rem; height: 1.6rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-family: var(--mono);
      font-size: 0.7rem;
    }

    .cta {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
      margin: 1.25rem 0 0 2.5rem;
    }
    .btn {
      border: 1px solid var(--line);
      padding: 0.9rem 1.4rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .mail { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .mail:hover { color: var(--fg); }

    /* Title block */
    .title-block {
      align-self: flex-end;
      margin: 0 var(--gutter) 2.25rem;
      display: grid;
      grid-template-columns: repeat(4, auto);
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .title-block div {
      padding: 0.5rem 0.75rem;
      border-right: 1px solid var(--faint);
      border-bottom: 1px solid var(--faint);
    }
    .title-block div:nth-child(4n) { border-right: 0; }
    .title-block div:nth-last-child(-n+4) { border-bottom: 0; }
    .title-block small { display: block; color: var(--muted); font-size: 0.6rem; margin-bottom: 0.2rem; }
    .title-block .wide { grid-column: span 2; }

    @media (max-width: 700px) {
      :root { --gutter: 1.75rem; }
      .title-block { align-self: stretch; grid-template-columns: repeat(2, 1fr); }
      .title-block div:nth-child(4n) { border-right: 1px solid var(--faint); }
      .title-block div:nth-child(2n) { border-right: 0; }
    }
  </style>
</head>
<body>
  <div class="sheet" aria-hidden="true"></div>

  <header>
    <span class="logo">The Larex</span>
    <a class="mono" href="mailto:hello@thelarex.com">Contact ↗</a>
  </header>

  <main>
    <div class="figure">
      <div class="dim-x" aria-hidden="true"><span class="mono">Product Studio</span></div>
      <div class="dim-y" aria-hidden="true"></div>
      <h1><b>Product Design</b><br />and Development</h1>
    </div>

    <div class="callout">
      <span class="bubble">A</span>
      <span class="mono">Fig. A — Get in touch</span>
    </div>
    <div class="cta">
      <a class="btn" href="mailto:hello@thelarex.com">Start a project →</a>
      <a class="mail" href="mailto:hello@thelarex.com">hello@thelarex.com</a>
    </div>
  </main>

  <div class="title-block" aria-label="Studio details">
    <div class="wide"><small>Project</small>The Larex</div>
    <div><small>Sheet</small>01 / 01</div>
    <div><small>Rev</small>A</div>
    <div class="wide"><small>Title</small>Product Studio</div>
    <div><small>Scale</small>1:1</div>
    <div><small>Year</small>2026</div>
  </div>
</body>
</html>
