<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Quiet atelier. Warm dark, big centred serif, slow and calm. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1613;
      --fg: #efe6da;
      --muted: #8e8172;
      --rule: rgba(239, 230, 218, 0.12);
      --gold: #c9a46a;
    }

    body {
      background:
        radial-gradient(80vw 70vh at 50% 45%, #2a231d 0%, transparent 70%),
        var(--bg);
      color: var(--fg);
      font-family: "Geist", -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 2.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    header a:hover { color: var(--fg); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .mark {
      font-family: "Instrument Serif", serif;
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: rise 1.6s ease 0.2s forwards;
    }

    h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 10vw, 9.5rem);
      line-height: 0.95;
      letter-spacing: -0.025em;
      max-width: 12ch;
    }
    h1 span {
      display: inline-block;
      opacity: 0;
      filter: blur(12px);
      animation: focus 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    h1 span:nth-child(2) { animation-delay: 0.15s; }
    h1 span:nth-child(3) { animation-delay: 0.3s; font-style: italic; color: var(--gold); }
    h1 span:nth-child(4) { animation-delay: 0.45s; }

    @keyframes focus { to { opacity: 1; filter: blur(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .divider {
      width: 1px;
      height: 4rem;
      background: linear-gradient(var(--rule), var(--gold), var(--rule));
      margin: 3rem 0 2rem;
      transform-origin: top;
      transform: scaleY(0);
      animation: grow 1.2s ease 1s forwards;
    }
    @keyframes grow { to { transform: scaleY(1); } }

    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: rise 1.4s ease 1.3s forwards;
    }
    .cta .label {
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cta a {
      font-family: "Instrument Serif", serif;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-style: italic;
      background: linear-gradient(var(--gold), var(--gold)) 0 100% / 0 1px no-repeat;
      transition: background-size 0.6s ease;
      padding-bottom: 2px;
    }
    .cta a:hover { background-size: 100% 1px; }

    footer {
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <span>The Larex</span>
    <a href="mailto:hello@thelarex.com">Contact</a>
  </header>

  <main>
    <div class="mark">— Product Studio —</div>
    <h1><span>Product</span> <span>Design</span> <span>and</span> <span>Development</span></h1>
    <div class="divider"></div>
    <div class="cta">
      <span class="label">Get in touch</span>
      <a href="mailto:hello@thelarex.com">hello@thelarex.com</a>
    </div>
  </main>

  <footer>&copy; 2026 The Larex</footer>
</body>
</html>
