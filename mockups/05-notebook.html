<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@400&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Designer's graph-paper notebook. Swiss type + pencil annotations. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f6f4ee;
      --minor: rgba(60, 110, 160, 0.10);
      --major: rgba(60, 110, 160, 0.20);
      --ink: #141414;
      --muted: #7d7a72;
      --pencil: #e2412a;
      --gutter: 2rem;
    }

    body {
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--major) 1px, transparent 1px),
        linear-gradient(90deg, var(--major) 1px, transparent 1px),
        linear-gradient(var(--minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--minor) 1px, transparent 1px);
      background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
      background-position: -1px -1px;
      color: var(--ink);
      font-family: "Inter Tight", Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hand {
      font-family: "Caveat", cursive;
      font-weight: 700;
      color: var(--pencil);
      line-height: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem var(--gutter);
    }
    .logo { font-weight: 700; letter-spacing: -0.01em; }
    header a:hover { color: var(--pencil); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem var(--gutter);
      max-width: 1200px;
    }

    .label { margin-bottom: 1.5rem; }

    h1 {
      font-size: clamp(3.2rem, 11vw, 10.5rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.06em;
      margin-bottom: 3.5rem;
    }

    /* Annotated words */
    .note {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }
    .note svg {
      position: absolute;
      pointer-events: none;
      overflow: visible;
    }
    .note path {
      fill: none;
      stroke: var(--pencil);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4000;
      stroke-dashoffset: 4000;
      animation: draw 1.1s cubic-bezier(0.6, 0, 0.3, 1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .circle svg { inset: -14% -6% -10% -6%; width: 112%; height: 124%; }
    .circle path { animation-delay: 0.5s; }

    .underline svg { left: 0; right: 0; bottom: -0.12em; width: 100%; height: 0.2em; }
    .underline path { animation-delay: 1.1s; }

    .margin {
      position: absolute;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      letter-spacing: 0;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      animation: pop 0.5s ease forwards;
    }
    .circle .margin { left: 102%; top: -0.6em; transform: rotate(-6deg); animation-delay: 1.3s; }
    .underline .margin { left: 100%; bottom: -0.4em; transform: rotate(3deg); animation-delay: 1.8s; padding-left: 0.5em; }
    @keyframes pop { to { opacity: 1; } }

    .cta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      position: relative;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--ink);
      color: var(--paper);
      padding: 0.95rem 1.4rem;
      font-weight: 500;
      box-shadow: 4px 4px 0 var(--pencil);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--pencil); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pencil); }

    .mail { border-bottom: 1px solid currentColor; }
    .mail:hover { color: var(--pencil); }

    .say-hi {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 1.5rem;
      transform: rotate(-4deg);
    }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.25rem var(--gutter);
    }

    @media (max-width: 700px) {
      :root { --gutter: 1.25rem; }
      .margin { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">The Larex</span>
    <a class="mono" href="mailto:hello@thelarex.com">Contact ↗</a>
  </header>

  <main>
    <span class="mono label">Product Studio — p. 01</span>
    <h1>
      Product
      <span class="note circle">Design
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path vector-effect="non-scaling-stroke" d="M8 30 C 20 4, 80 2, 95 28 C 104 50, 92 88, 50 94 C 12 98, -2 70, 4 46 C 8 30, 22 14, 40 10" />
        </svg>
        <span class="margin hand" aria-hidden="true">← the fun part</span>
      </span><br />
      <span class="note underline">&amp; Development
        <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
          <path vector-effect="non-scaling-stroke" d="M1 6 C 20 3, 45 8, 70 4 S 95 5, 99 3" />
        </svg>
      </span>
    </h1>

    <div class="cta">
      <a class="btn" href="mailto:hello@thelarex.com">Get in touch →</a>
      <a class="mail" href="mailto:hello@thelarex.com">hello@thelarex.com</a>
      <span class="hand say-hi" aria-hidden="true">
        <svg width="34" height="20" viewBox="0 0 34 20" fill="none"><path d="M32 14 C 22 18, 10 16, 3 6 M3 6 L 4 14 M3 6 L 11 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        say hi!
      </span>
    </div>
  </main>

  <footer>
    <span class="mono">&copy; 2026 The Larex</span>
    <span class="mono">hello@thelarex.com</span>
  </footer>
</body>
</html>
