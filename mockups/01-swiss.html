<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Swiss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Direction: Swiss / International Style. Paper, grid, one red accent. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f1efe9;
      --ink: #111111;
      --muted: #8a877f;
      --rule: rgba(17, 17, 17, 0.14);
      --red: #e63312;
      --gutter: 2rem;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* 12-col guide lines */
    .grid-lines {
      position: fixed;
      inset: 0 var(--gutter);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      pointer-events: none;
      z-index: 0;
    }
    .grid-lines span { border-left: 1px solid var(--rule); }
    .grid-lines span:last-child { border-right: 1px solid var(--rule); }

    header, main, footer {
      position: relative;
      z-index: 1;
      padding: 0 var(--gutter);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
    }

    header {
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--ink);
      font-size: 0.8rem;
      font-weight: 500;
      align-items: baseline;
    }
    header .logo { grid-column: 1 / 4; font-weight: 800; letter-spacing: -0.01em; }
    header .meta { grid-column: 4 / 10; color: var(--muted); }
    header nav { grid-column: 10 / 13; text-align: right; }
    header nav a:hover { color: var(--red); }

    main {
      align-content: end;
      padding-top: 4rem;
      padding-bottom: 2rem;
      row-gap: 2.5rem;
    }

    .index {
      grid-column: 1 / 7;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .index::before {
      content: "";
      flex: none;
      width: 0.6rem; height: 0.6rem;
      background: var(--red);
      border-radius: 50%;
    }

    h1 {
      grid-column: 1 / 13;
      font-size: clamp(3.5rem, 13vw, 13rem);
      font-weight: 700;
      line-height: 0.86;
      letter-spacing: -0.065em;
    }
    h1 span { display: block; overflow: hidden; padding-bottom: 0.14em; margin-bottom: -0.14em; }
    h1 span > i {
      display: block;
      font-style: normal;
      transform: translateY(105%);
      animation: up 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) forwards;
    }
    h1 span:nth-child(2) > i { animation-delay: 0.08s; }
    h1 span:nth-child(3) > i { animation-delay: 0.16s; color: var(--red); }

    @keyframes up { to { transform: translateY(0); } }

    .row {
      grid-column: 1 / 13;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      border-top: 1px solid var(--ink);
      padding-top: 1rem;
      font-size: 0.95rem;
      line-height: 1.4;
      opacity: 0;
      animation: fade 0.8s ease 0.6s forwards;
    }
    .row p { grid-column: 1 / 5; color: var(--muted); }
    .row .cta { grid-column: 7 / 13; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--ink);
      color: var(--paper);
      padding: 0.9rem 1.25rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--red); }
    .mail { border-bottom: 1px solid currentColor; }
    .mail:hover { color: var(--red); }

    @keyframes fade { to { opacity: 1; } }

    footer {
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
      border-top: 1px solid var(--rule);
      font-size: 0.75rem;
      color: var(--muted);
    }
    footer span:first-child { grid-column: 1 / 7; }
    footer span:last-child { grid-column: 7 / 13; text-align: right; }

    @media (max-width: 700px) {
      :root { --gutter: 1rem; }
      .grid-lines { grid-template-columns: repeat(4, 1fr); }
      .grid-lines span:nth-child(n+5) { display: none; }
      header .meta { display: none; }
      header .logo { grid-column: 1 / 7; }
      header nav { grid-column: 7 / 13; }
      .row p { grid-column: 1 / 13; margin-bottom: 1.5rem; }
      .row .cta { grid-column: 1 / 13; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="grid-lines" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <span class="logo">The Larex</span>
    <span class="meta">Product Studio</span>
    <nav><a href="mailto:hello@thelarex.com">Contact ↗</a></nav>
  </header>

  <main>
    <span class="index">Product Studio</span>
    <h1>
      <span><i>Product</i></span>
      <span><i>Design &amp;</i></span>
      <span><i>Development</i></span>
    </h1>
    <div class="row">
      <p>The Larex is a product design and development studio.</p>
      <div class="cta">
        <a class="mail" href="mailto:hello@thelarex.com">hello@thelarex.com</a>
        <a class="btn" href="mailto:hello@thelarex.com">Get in touch <span>→</span></a>
      </div>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 The Larex</span>
    <span>hello@thelarex.com</span>
  </footer>
</body>
</html>
