<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Larex — Product Design & Development</title>
  <meta name="description" content="The Larex is a product design and development studio." />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --muted: #666666;
      --accent: #f0f0f0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Layout ───────────────────────────────────────────── */

    header {
      padding: 2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    nav {
      font-size: 0.85rem;
      color: var(--muted);
    }

    nav a:hover {
      color: var(--text);
      transition: color 0.15s;
    }

    /* ── Hero ─────────────────────────────────────────────── */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6rem 2.5rem;
      max-width: 760px;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 3.75rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-bottom: 2rem;
    }

    h1 em {
      font-style: normal;
      color: var(--muted);
    }

    /* ── CTA ──────────────────────────────────────────────── */

    .cta-group {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      background: var(--surface);
      color: var(--accent);
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .btn:hover {
      background: #1a1a1a;
      border-color: #333;
    }

    /* ── Footer ───────────────────────────────────────────── */

    footer {
      padding: 2rem 2.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 4rem;
    }

    .footer-copy {
      font-size: 0.8rem;
      color: var(--muted);
    }


    /* ── Responsive ───────────────────────────────────────── */

    @media (max-width: 600px) {
      header, footer, .divider, .services {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      .services {
        margin: 0 1.5rem;
      }

      .divider {
        margin-left: 1.5rem;
        margin-right: 1.5rem;
      }

      main {
        padding: 4rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">The Larex</span>
    <nav>
      <a href="mailto:hello@thelarex.com">Contact</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Product Studio</p>
    <h1>Product Design and Development</h1>
    <div class="cta-group">
      <a href="mailto:hello@thelarex.com" class="btn">
        Get in touch
      </a>
    </div>
  </main>


  <footer>
    <span class="footer-copy">&copy; 2026 The Larex</span>
  </footer>

</body>
</html>
